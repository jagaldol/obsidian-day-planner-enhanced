<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Day Planner Enhanced</title>
  <desc id="description">Nested schedules stay readable inside the Obsidian timeline.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24143f"/>
      <stop offset="0.48" stop-color="#13101b"/>
      <stop offset="1" stop-color="#071c18"/>
    </linearGradient>
    <radialGradient id="purpleGlow" cx="0.06" cy="0.02" r="0.72">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.58"/>
      <stop offset="0.52" stop-color="#7c3aed" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="0.95" cy="0.95" r="0.52">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screenBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0.32"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="contextClip">
      <rect x="500" y="110" width="540" height="360" rx="22"/>
    </clipPath>
    <clipPath id="sidebarClip">
      <rect x="900" y="48" width="292" height="540" rx="22"/>
    </clipPath>
    <filter id="screenShadow" x="-12%" y="-20%" width="128%" height="145%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="sidebarShadow" x="-22%" y="-14%" width="150%" height="132%">
      <feDropShadow dx="0" dy="26" stdDeviation="18" flood-color="#000000" flood-opacity="0.58"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#purpleGlow)"/>
  <rect width="1280" height="640" fill="url(#greenGlow)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect x="0" y="0" width="1280" height="640" fill="#000000" opacity="0.08"/>

  <g font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif">
    <rect x="64" y="70" width="286" height="36" rx="18" fill="#7c3aed" fill-opacity="0.2" stroke="#c4b5fd" stroke-opacity="0.32"/>
    <rect x="78" y="79" width="18" height="18" rx="5" fill="#8b5cf6"/>
    <path d="M82 85h10M84 91h7" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="108" y="94" fill="#ddd6fe" font-size="13" font-weight="700">OBSIDIAN PLUGIN</text>

    <text x="64" y="184" fill="#fbfaff" font-size="56" font-weight="760">Day Planner</text>
    <text x="64" y="244" fill="#a78bfa" font-size="56" font-weight="760">Enhanced</text>

    <text x="66" y="318" fill="#e8e3ef" font-size="25" font-weight="500">Nested schedules that</text>
    <text x="66" y="353" fill="#e8e3ef" font-size="25" font-weight="500">stay readable in your</text>
    <text x="66" y="388" fill="#e8e3ef" font-size="25" font-weight="500">Obsidian timeline.</text>

    <g fill="#f0edf7" font-size="17" font-weight="650">
      <circle cx="78" cy="449" r="10" fill="#8b5cf6" fill-opacity="0.18" stroke="#a78bfa" stroke-opacity="0.7"/>
      <path d="M73.5 449.2l3 3 6-6" fill="none" stroke="#d8b4fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="102" y="455">Grouped child items</text>

      <circle cx="78" cy="492" r="10" fill="#10b981" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.62"/>
      <path d="M73.5 492.2l3 3 6-6" fill="none" stroke="#86efac" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="102" y="498">Timed plans stay inside</text>
    </g>

    <text x="64" y="586" fill="#a49db2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">jagaldol / obsidian-day-planner-enhanced</text>

    <g opacity="0.36" filter="url(#screenShadow)">
      <rect x="488" y="98" width="564" height="384" rx="28" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="500" y="110" width="540" height="360" rx="22" fill="#f6f7f8"/>
      <image xlink:href="timeline-nested-schedule-demo.png" href="timeline-nested-schedule-demo.png" x="500" y="110" width="626" height="360" preserveAspectRatio="xMidYMid slice" clip-path="url(#contextClip)"/>
      <rect x="500.5" y="110.5" width="539" height="359" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.2"/>
    </g>

    <g filter="url(#sidebarShadow)">
      <rect x="886" y="34" width="320" height="568" rx="32" fill="#ffffff" fill-opacity="0.1"/>
      <rect x="900" y="48" width="292" height="540" rx="22" fill="#f6f7f8"/>
      <image xlink:href="timeline-sidebar-demo.png" href="timeline-sidebar-demo.png" x="900" y="48" width="292" height="608" preserveAspectRatio="xMidYMid slice" clip-path="url(#sidebarClip)"/>
      <rect x="900.5" y="48.5" width="291" height="539" rx="21.5" fill="none" stroke="url(#screenBorder)" stroke-width="1.2"/>
    </g>

  </g>
</svg>
